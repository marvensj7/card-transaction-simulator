spring.application.name=card-transaction-simulator
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/card_transaction_simulator?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# SQL scripts own the schema. Hibernate checks it, but never creates or alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL parameters may include password hashes; keep SQL and bind logging off.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
# Driver error text can repeat SQL values before the shared handler receives it.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# Spring's validation warnings can include rejected card fields. Do not log requests.
logging.level.org.springframework.web=OFF
spring.mvc.log-request-details=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
